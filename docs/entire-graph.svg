<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%" style="background:#09090b; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;">
  <defs>
    <linearGradient id="grad-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="grad-card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#121215"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Header -->
  <text x="40" y="45" fill="#ffffff" font-size="20" font-weight="700">mone — Entire Repository Architecture Graph</text>
  <text x="40" y="70" fill="#a1a1aa" font-size="12">Verified with Entire CLI 0.11.4 · Tracking Antigravity &amp; Claude Code Sessions</text>

  <!-- Group: Weather Ingestion Layer -->
  <rect x="40" y="100" width="260" height="180" rx="12" fill="url(#grad-card)" stroke="#27272a" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="40" y="100" width="260" height="34" rx="12" fill="#27272a" fill-opacity="0.4"/>
  <text x="56" y="122" fill="#60a5fa" font-size="13" font-weight="600">mone.providers</text>
  <text x="250" y="122" fill="#71717a" font-size="10">MODULE</text>
  <text x="56" y="155" fill="#e4e4e7" font-size="11">● FallbackWeatherProvider</text>
  <text x="56" y="180" fill="#a1a1aa" font-size="11">  ├ GoogleWeatherNext3 (BigQuery/GCS)</text>
  <text x="56" y="205" fill="#a1a1aa" font-size="11">  └ OpenMeteoWeatherNext2 (63-mbr)</text>
  <text x="56" y="235" fill="#34d399" font-size="11">✔ Self-healing fallback on 503</text>
  <text x="56" y="258" fill="#71717a" font-size="10">Neatlogs span: fetch_weather_forecasts</text>

  <!-- Group: Prediction Markets Connector -->
  <rect x="40" y="320" width="260" height="180" rx="12" fill="url(#grad-card)" stroke="#27272a" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="40" y="320" width="260" height="34" rx="12" fill="#27272a" fill-opacity="0.4"/>
  <text x="56" y="342" fill="#38bdf8" font-size="13" font-weight="600">mone.markets</text>
  <text x="250" y="342" fill="#71717a" font-size="10">MODULE</text>
  <text x="56" y="375" fill="#e4e4e7" font-size="11">● KalshiClient (v2 Demo &amp; Live)</text>
  <text x="56" y="400" fill="#a1a1aa" font-size="11">  └ KXRAIN 22 Airport Stations</text>
  <text x="56" y="425" fill="#e4e4e7" font-size="11">● PolymarketClient (CLOB)</text>
  <text x="56" y="450" fill="#a1a1aa" font-size="11">● resolve_station (Fuzzy Parser)</text>
  <text x="56" y="478" fill="#71717a" font-size="10">Neatlogs span: fetch_market_quotes</text>

  <!-- Central Orchestrator: mone.agent -->
  <rect x="360" y="180" width="240" height="200" rx="12" fill="url(#grad-card)" stroke="#818cf8" stroke-width="2" filter="url(#shadow)"/>
  <rect x="360" y="180" width="240" height="36" rx="12" fill="#818cf8" fill-opacity="0.15"/>
  <text x="376" y="204" fill="#a5b4fc" font-size="14" font-weight="700">mone.agent</text>
  <text x="535" y="204" fill="#818cf8" font-size="10">CORE</text>
  <text x="376" y="238" fill="#ffffff" font-size="12" font-weight="600">MoneAgent Orchestrator</text>
  <text x="376" y="265" fill="#e4e4e7" font-size="11">● step() cycle loop</text>
  <text x="376" y="290" fill="#e4e4e7" font-size="11">● execute_custom_trade()</text>
  <text x="376" y="315" fill="#e4e4e7" font-size="11">● resolve_settlements()</text>
  <text x="376" y="340" fill="#e4e4e7" font-size="11">● approve_copilot_signal()</text>
  <text x="376" y="365" fill="#a1a1aa" font-size="10">Neatlogs root: mone_trading_cycle</text>

  <!-- Strategy & Risk Guardrails -->
  <rect x="660" y="100" width="260" height="180" rx="12" fill="url(#grad-card)" stroke="#27272a" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="660" y="100" width="260" height="34" rx="12" fill="#27272a" fill-opacity="0.4"/>
  <text x="676" y="122" fill="#f43f5e" font-size="13" font-weight="600">mone.risk &amp; strategy</text>
  <text x="870" y="122" fill="#71717a" font-size="10">GUARD</text>
  <text x="676" y="155" fill="#e4e4e7" font-size="11">● RiskManager ($50 Max Drawdown)</text>
  <text x="676" y="180" fill="#a1a1aa" font-size="11">  ├ Capital per trade limit ($10-$25)</text>
  <text x="676" y="205" fill="#a1a1aa" font-size="11">  └ Max Ask Ceiling ($0.80)</text>
  <text x="676" y="235" fill="#e4e4e7" font-size="11">● Kelly Sizing &amp; Edge Evaluation</text>
  <text x="676" y="258" fill="#71717a" font-size="10">Neatlogs span: evaluate_market_signals</text>

  <!-- State & Persistence Ledger -->
  <rect x="660" y="320" width="260" height="180" rx="12" fill="url(#grad-card)" stroke="#27272a" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="660" y="320" width="260" height="34" rx="12" fill="#27272a" fill-opacity="0.4"/>
  <text x="676" y="342" fill="#fbbf24" font-size="13" font-weight="600">mone.state (SQLite)</text>
  <text x="865" y="342" fill="#71717a" font-size="10">STORAGE</text>
  <text x="676" y="375" fill="#e4e4e7" font-size="11">● Zero-Config mone.db Ledger</text>
  <text x="676" y="400" fill="#a1a1aa" font-size="11">  ├ account_ledger (Cash &amp; Equity)</text>
  <text x="676" y="425" fill="#a1a1aa" font-size="11">  ├ signals (Copilot Queue)</text>
  <text x="676" y="450" fill="#a1a1aa" font-size="11">  └ positions (Open &amp; Settled)</text>
  <text x="676" y="478" fill="#71717a" font-size="10">Atomic SQLite checks &amp; balances</text>

  <!-- Connectors -->
  <!-- providers -> agent -->
  <path d="M 300 190 L 360 230" fill="none" stroke="#6366f1" stroke-width="2" stroke-dasharray="4 2"/>
  <!-- markets -> agent -->
  <path d="M 300 370 L 360 330" fill="none" stroke="#6366f1" stroke-width="2" stroke-dasharray="4 2"/>
  <!-- agent -> risk -->
  <path d="M 600 230 L 660 190" fill="none" stroke="#818cf8" stroke-width="2"/>
  <!-- agent -> state -->
  <path d="M 600 330 L 660 370" fill="none" stroke="#818cf8" stroke-width="2"/>

</svg>
